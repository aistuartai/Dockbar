name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          jq --arg v "$VERSION" '.version = $v' custom_components/dockbar/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/dockbar/manifest.json
      - run: npm test
      - run: npm run build
      # HACS unpacks this zip into custom_components/dockbar, so the files go at the zip root.
      - name: Package integration
        run: cd custom_components/dockbar && zip -r ../../dockbar.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: dockbar.zip
          generate_release_notes: true
