name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the committed version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          MANIFEST=$(jq -r .version custom_components/dockbar/manifest.json)
          if [ "$PKG" != "$VERSION" ] || [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::Tag is $VERSION but package.json is $PKG and manifest.json is $MANIFEST. Bump both, commit, then tag."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      # HACS unpacks this zip into custom_components/dockbar, so the files go at the zip root.
      - name: Package integration
        run: |
          test -f custom_components/dockbar/frontend/dockbar.js
          cd custom_components/dockbar && zip -r ../../dockbar.zip . -x "__pycache__/*"
          unzip -l ../../dockbar.zip | grep -q "frontend/dockbar.js"
      # The release text is this version's section of CHANGELOG.md, which is what HACS shows when updating.
      # A tag with no section there (a beta, say) gets GitHub's generated notes instead.
      - name: Release notes from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            echo "" >> notes.md
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md" >> notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dockbar.zip
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
